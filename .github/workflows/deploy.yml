name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and preservation baseline
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install, build, verify and upload static site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.3.11
          build-cmd: bun install --frozen-lockfile && git diff --exit-code -- bun.lock && bun run validate:docs && bun run check && bun run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
